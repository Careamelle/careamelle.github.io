<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation & Art Portfolio</title>
    <style>
        /* Minimalist base settings */
        body {
            margin: 0;
            padding: 0;
            background-color: #FAFAFA;
            color: #333333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* --- Hero Background Section --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 70vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ddd; 
            background-size: cover;
            background-position: center;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            transition: background 0.5s ease; /* Smooth fading effect */
        }

        /* New class added by JavaScript to lower the brightness */
        .hero-overlay.dimmed {
            background: rgba(0, 0, 0, 0.85); /* Much darker overlay */
        }

        /* --- Floating Profile Box --- */
        .floating-profile-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px 40px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin-top: 40px; 
        }

        .profile-avatar {
            position: absolute;
            top: -60px; 
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eee;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .floating-profile-card h1 {
            font-family: Georgia, serif;
            font-size: 2rem;
            margin: 10px 0 5px 0;
            color: #222;
        }

        .floating-profile-card p.credentials {
            font-size: 1rem;
            color: #555;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .floating-profile-card p.location {
            font-size: 0.9rem;
            color: #888;
            margin: 0;
        }

        /* --- Portfolio Section --- */
        .portfolio-section {
            padding: 60px 20px;
            text-align: center;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        /* Gallery Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: left;
        }

        .gallery-item {
            background-color: #EFEFEF; 
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 4/3; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            cursor: pointer; 
            transition: transform 0.2s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.02); 
        }

        .gallery-item.hidden {
            display: none !important;
        }

        /* --- NEW: Lightbox Styles --- */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 9999; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 80%; 
            max-height: 80%; 
            object-fit: contain; 
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }

        .lightbox-close:hover {
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- HERO SECTION WITH BACKGROUND AND FLOATING PROFILE -->
    <!-- Put your background image file name here -->
    <div class="hero-section" style="background-image: url('Front page.png');">
        <!-- Added ID to the overlay so JavaScript can find it -->
        <div class="hero-overlay" id="heroOverlay"></div>
        
        <div class="floating-profile-card">
            <img src="my-new-model.jpg" alt="Profile" class="profile-avatar">
            
            <h1>Carmel Angelo N. Hervera</h1>
            <p class="credentials">Electronics Engineering Student & Animator</p>
            <p class="location">Sorsogon City, Philippines</p>
        </div>
    </div>

    <!-- PORTFOLIO SECTION -->
    <div class="portfolio-section">
        
        <!-- Category Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Works</button>
            <button class="filter-btn" data-filter="arts">Arts</button>
            <button class="filter-btn" data-filter="animations">Animations</button>
            <button class="filter-btn" data-filter="sketches">Sketches</button>
        </div>

        <!-- Gallery Container -->
        <div class="gallery">
            
            <!-- Art Items -->
            <div class="gallery-item arts">
                <img src="Fuu~chan.png" alt="Fuu~chan">
            </div>
            <div class="gallery-item arts">
                <img src="recreation-finish.png" alt="Recreation signature">
            </div>
            <div class="gallery-item arts">
                <img src="picrew-genshin.png" alt="Picrew genshin for tiktok">
            </div>
            <div class="gallery-item arts">
                <img src="Genshin-oc-picrew.png" alt="Genshin OC picrew">
            </div>

            <!-- Animation Items -->
            <div class="gallery-item animations">
                <img src="1st-action-scene.gif" alt="Animation 1">
            </div>
            <div class="gallery-item animations">
                <img src="I-wink.gif" alt="Animation 2">
            </div>
            <div class="gallery-item animations">
                <img src="Pew... boom.gif" alt="Animation 3">
            </div>
            <div class="gallery-item animations">
                <img src="animation1.gif" alt="Animation 4">
            </div>

            <!-- Sketch Items -->
            <div class="gallery-item sketches">
                <img src="Xiangling.jpg" alt="Sketch 1">
            </div>
            <div class="gallery-item sketches">
                <img src="Paimon.png" alt="Sketch 2">
            </div>
               <div class="gallery-item sketches">
                <img src="Lalatina Handpractice 3.jpg" alt="Sketch 2">
            </div>
                <div class="gallery-item sketches">
                <img src="the coco brush.png" alt="Sketch 2">
            </div>
            
        </div>
    </div>

    <!-- NEW: Lightbox Container -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="Expanded Image">
    </div>

    <!-- Scripts for Filtering and Lightbox -->
    <script>
        // 1. Filtering & Background Dimming Logic
        const filterButtons = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const heroOverlay = document.getElementById('heroOverlay');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const filterValue = button.getAttribute('data-filter');

                // --- NEW: Background dimming logic ---
                if (filterValue === 'all') {
                    // Brightens background on "All Works"
                    heroOverlay.classList.remove('dimmed'); 
                } else {
                    // Darkens background on specific categories
                    heroOverlay.classList.add('dimmed'); 
                }

                galleryItems.forEach(item => {
                    if (filterValue === 'all' || item.classList.contains(filterValue)) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        // 2. Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');
        const galleryImages = document.querySelectorAll('.gallery-item img');

        // Open lightbox when an image is clicked
        galleryImages.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src; 
                lightbox.classList.add('active'); 
            });
        });

        // Close lightbox when clicking the 'X'
        lightboxClose.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        // Close lightbox when clicking anywhere on the dark background
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
